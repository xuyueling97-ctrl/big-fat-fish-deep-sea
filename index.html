<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#031019">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大肥鱼">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="大肥鱼 · 深海吞食 —— 一款可以在浏览器里直接玩的深海吞食小游戏。吃小鱼长大，躲大鱼活命，一路吃成深海之王。">
<title>大肥鱼 · 深海吞食</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23041a24'/%3E%3Cellipse cx='30' cy='32' rx='16' ry='11' fill='%235ff0d0'/%3E%3Cpath d='M46 32l12-8v16z' fill='%235ff0d0'/%3E%3Ccircle cx='22' cy='29' r='2.6' fill='%23041a24'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div class="hud is-hidden" id="hud">
    <div class="hud__top">
      <div class="stat">
        <div class="stat__label">得分</div>
        <div class="stat__value" id="scoreValue">0</div>
        <div class="stat__best">最高 <b id="bestValue">0</b></div>
      </div>
      <div class="hud__tools">
        <div class="hearts" id="hearts"></div>
        <button class="icon-btn" id="btnSound" title="声音开关" aria-label="声音开关">♪</button>
        <button class="icon-btn" id="btnPause" title="暂停 (Esc)" aria-label="暂停">
          <span class="pause-icon"><i></i><i></i></span>
        </button>
      </div>
    </div>

    <div class="hud__bottom">
      <div class="meter">
        <div class="meter__row">
          <span class="meter__stage" id="stageName">鱼苗</span>
          <span class="meter__combo" id="comboTag"></span>
        </div>
        <div class="meter__bar"><div class="meter__fill" id="growthFill"></div></div>
        <div class="meter__row meter__row--sub">
          <span class="meter__label">冲刺能量</span>
          <div class="meter__bar meter__bar--dash"><div class="meter__fill meter__fill--dash" id="dashFill"></div></div>
        </div>
      </div>
      <div class="powers" id="powerTags"></div>
    </div>
  </div>

  <button class="dash-btn is-hidden" id="dashBtn" aria-label="冲刺">冲刺</button>

  <!-- 左下角摇杆：只在触屏显示，方向由摇杆输出，冲刺仍归右下按钮 -->
  <div class="stick is-hidden" id="stick" aria-label="方向摇杆">
    <div class="stick__base">
      <span class="stick__ring"></span>
      <span class="stick__knob" id="stickKnob"></span>
    </div>
  </div>

  <div class="screen" id="screenStart">
    <div class="panel">
      <h1 class="title">大肥鱼</h1>
      <p class="subtitle">BIG FAT FISH · 深海吞食</p>
      <p class="blurb">吃小的，躲大的。<br>冲刺逃命，连击涨分，一路吃成深海之王。</p>
      <ul class="hints">
        <li><b>游动</b><span class="hint-desktop">鼠标移动 / WASD</span><span class="hint-touch">左下角摇杆</span></li>
        <li><b>冲刺</b><span class="hint-desktop">空格 / Shift</span><span class="hint-touch">右下「冲刺」按钮</span></li>
        <li><b>暂停</b><span class="hint-desktop">Esc / P</span><span class="hint-touch">右上暂停按钮</span></li>
      </ul>
      <p class="egg-secret is-hidden" id="eggSecret">彩蛋已解锁：<b>金鳞锦鲤</b> 会在这片海里等你。</p>
      <button class="btn btn--primary" id="btnStart">开始游戏</button>
      <p class="foot hint-desktop">建议横屏游玩 · 也可用键盘操作</p>
      <p class="foot hint-touch">手机自动横屏 · 推摇杆控制方向</p>
    </div>
  </div>

  <div class="screen is-hidden" id="screenPause">
    <div class="panel panel--slim">
      <h2 class="panel__title">暂停</h2>
      <p class="blurb">深海很安静，但大鱼还在等你。</p>
      <div class="btn-row">
        <button class="btn btn--primary" id="btnResume">继续</button>
        <button class="btn" id="btnRestartPause">重新开始</button>
      </div>
      <button class="link-btn" id="btnSoundPause">声音：开</button>
    </div>
  </div>

  <div class="screen is-hidden" id="screenOver">
    <div class="panel">
      <h2 class="panel__title" id="overTitle">被吞掉了</h2>
      <p class="blurb" id="overText"></p>
      <div class="result">
        <div class="result__item">
          <span>本局得分</span>
          <b id="finalScore">0</b>
        </div>
        <div class="result__item">
          <span>最终体型</span>
          <b id="finalSize">鱼苗</b>
        </div>
        <div class="result__item">
          <span>吃掉的鱼</span>
          <b id="finalEats">0</b>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn--primary" id="btnRestart">再来一局</button>
      </div>
      <p class="foot" id="newRecord" hidden>🏆 新纪录！</p>
    </div>
  </div>

  <div class="error-banner is-hidden" id="errorBanner"></div>
</div>

<script src="js/utils.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
